[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TreeMPU"
version = "0.1.0"
description = "Quantum circuit synthesis for Matrix Product Unitaries (Styliaris et al.)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Marco Vassallo", email = "marco.vassallo02@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "quimb>=1.4.0",
    "jax>=0.4",
    "qiskit>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/Mrcocvs02/MPU_Decomposition"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "mpu_generators"]
