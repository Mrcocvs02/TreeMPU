[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TreeMPU"
version = "0.2.0"
description = "Exact quantum-circuit synthesis of Matrix Product Unitaries (tree decomposition with oblivious amplitude amplification)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Marco Vassallo", email = "marco.vassallo02@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "quimb>=1.4.0",
    "jax>=0.4",
    "qiskit>=1.3",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.7",
    "jupyter",
]
dev = [
    "pytest>=7.0.0",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/Mrcocvs02/MPU_Decomposition"

[tool.pytest.ini_options]
testpaths = ["tests", "mpu_generators/tests"]
pythonpath = [".", "mpu_generators"]
markers = [
    "slow: long-running tests (JAX optimization, circuit reconstruction); deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E731"]
# Notebooks set JAX_PLATFORMS before importing TreeMPU.
"notebooks/*" = ["E402"]
